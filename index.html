<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متصفحي الخاص</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px 20px;
            margin: 0;
        }
        h1 {
            margin-bottom: 30px;
        }
        .search-container {
            margin-bottom: 30px;
        }
        input[type="text"] {
            width: 70%;
            max-width: 500px;
            padding: 12px 15px;
            font-size: 16px;
            border-radius: 25px;
            border: 1px solid #333;
            outline: none;
            background-color: #1e1e1e;
            color: #fff;
        }
        button {
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 25px;
            border: none;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .links {
            margin-top: 40px;
        }
        .links a {
            color: #4da6ff;
            margin: 0 15px;
            text-decoration: none;
            font-size: 18px;
            display: inline-block;
            margin-bottom: 10px;
        }
        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>مرحباً بك في متصفحك الخاص</h1>
    <div class="search-container">
        <form action="https://www.google.com/search" method="get">
            <input type="text" name="q" placeholder="ابحث في جوجل...">
            <br>
            <button type="submit">بحث</button>
        </form>
    </div>
    <div class="links">
        <a href="https://www.youtube.com">YouTube</a>
        <a href="https://www.google.com">Google</a>
    </div>
</body>
</html>
