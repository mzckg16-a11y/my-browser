<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متصفحي الخاص</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 50px 20px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
        }
        .search-container {
            margin-bottom: 40px;
        }
        input[type="text"] {
            width: 80%;
            max-width: 500px;
            padding: 12px 20px;
            border-radius: 25px;
            border: 1px solid #333;
            background-color: #1e1e1e;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }
        button {
            padding: 12px 25px;
            border-radius: 25px;
            border: none;
            background-color: #007bff;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 15px;
        }
        .shortcuts {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .shortcuts a {
            color: #4da6ff;
            text-decoration: none;
            font-size: 1.2rem;
            padding: 8px 16px;
            background-color: #1e1e1e;
            border-radius: 8px;
            transition: background-color 0.3s;
        }
        .shortcuts a:hover {
            background-color: #333;
        }
    </style>
</head>
<body>

    <h1>مرحباً بك في متصفحك الخاص</h1>

    <div class="search-container">
        <form action="https://www.google.com/search" method="get">
            <input type="text" name="q" placeholder="ابحث في جوجل..." required><br>
            <button type="submit">بحث</button>
        </form>
    </div>

    <div class="shortcuts">
        <a href="https://www.google.com">Google</a>
        <a href="https://www.youtube.com">YouTube</a>
        <a href="https://romsfun.com">ROMSFUN</a>
    </div>

</body>
</html>
